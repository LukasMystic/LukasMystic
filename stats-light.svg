<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 152" width="1280" height="152" role="img" aria-label="4+ papers accepted, 5+ research projects, 100K+ samples handled, 191 learners trained">
<style>
  .card { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
  .num  { animation: rise .6s cubic-bezier(.2,.7,.3,1) both; }
  .rule { transform-origin: left center; animation: draw .7s cubic-bezier(.3,.8,.3,1) both; }
  @keyframes rise { from { opacity:0; transform: translateY(10px) } }
  @keyframes draw { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  .k0 { animation-delay: 0.08s }
  .n0 { animation-delay: 0.18s }
  .r0 { animation-delay: 0.30s }
  .k1 { animation-delay: 0.19s }
  .n1 { animation-delay: 0.29s }
  .r1 { animation-delay: 0.41s }
  .k2 { animation-delay: 0.30s }
  .n2 { animation-delay: 0.40s }
  .r2 { animation-delay: 0.52s }
  .k3 { animation-delay: 0.41s }
  .n3 { animation-delay: 0.51s }
  .r3 { animation-delay: 0.63s }
</style>
<g class="card k0">
<rect x="0.8" y="0.75" width="303.5" height="150.5" rx="18" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.5"/>
<text class="num n0" x="26.0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.2" fill="#0071E3">4+</text>
<rect class="rule r0" x="26.0" y="80" width="253.0" height="3" rx="1.5" fill="#0071E3" opacity=".28"/>
<text x="26.0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1D1D1F">Papers accepted</text>
<text x="26.0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6E6E73">One publicly citable, the rest under NDA</text>
</g>
<g class="card k1">

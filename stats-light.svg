</g>
<g class="card k2">
<rect x="650.8" y="0.75" width="303.5" height="150.5" rx="18" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.5"/>
<text class="num n2" x="676.0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-1.2" fill="#0071E3">100K+</text>

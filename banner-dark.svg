<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="Stanley Pratama Teguh — AI, machine learning and full-stack engineering">
<style>
  .eyebrow { animation: rise .55s cubic-bezier(.2,.7,.3,1) .15s both; }
  .name    { animation: rise .65s cubic-bezier(.2,.7,.3,1) .32s both; }
  .tagclip { transform-origin: 64px 168px; animation: type 1.35s steps(30,end) .95s both; }
  .caret   { animation: caret 1.35s steps(30,end) .95s both, blink 1.05s step-end 2.3s infinite; }
  .tile    { animation: pop .5s cubic-bezier(.2,.9,.3,1) both; }
  .sweep   { animation: sweep 4.6s cubic-bezier(.5,0,.5,1) 1.5s infinite; }
  @keyframes rise  { from { opacity:0; transform: translateY(9px); } to { opacity:1; transform: none; } }
  @keyframes pop   { from { opacity:0; transform: scale(.6); } }
  @keyframes type  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes caret { from { transform: translateX(0); } to { transform: translateX(376px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes sweep { 0% { transform: translateX(-260px); } 55%,100% { transform: translateX(376px); } }
  .c0 { animation: rise .5s cubic-bezier(.2,.7,.3,1) 2.25s both; }
  .c1 { animation: rise .5s cubic-bezier(.2,.7,.3,1) 2.33s both; }
  .c2 { animation: rise .5s cubic-bezier(.2,.7,.3,1) 2.40s both; }
  .c3 { animation: rise .5s cubic-bezier(.2,.7,.3,1) 2.48s both; }
  .c4 { animation: rise .5s cubic-bezier(.2,.7,.3,1) 2.55s both; }
  .c5 { animation: rise .5s cubic-bezier(.2,.7,.3,1) 2.62s both; }
</style>
